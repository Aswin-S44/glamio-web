version: "3.8"

services:
  db:
    image: mysql:8.0
    container_name: glamio-db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root1234
      MYSQL_DATABASE: glamio
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql

  backend:
    build: .
    container_name: glamio_backend
    restart: on-failure
    env_file: .env
    ports:
      - "5000:5000"
    depends_on:
      - db

volumes:
  db_data:
